<section style="
  position: relative;
  height: 40vh;
  min-height: 600px;
  overflow: hidden;
  margin-top: 0;
  padding: 0;
  width: 100vw;
  margin-left: calc(50% - 50vw);
">

  <!-- Foto -->
  <img src="../images/foto moj.webp" style="
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
  "/>

  <!-- Fade naar wit onderaan -->
  <div style="
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 75%;
    background: linear-gradient(to bottom, transparent, #F8F6F1);
  "></div>

  <!-- Tekst linksonder -->
  <div style="
    position: absolute;
    bottom: 60px;
    left: 60px;
    max-width: 560px;
    z-index: 2;
    background: var(--sand);
    padding: 22px 28px;
    border-radius: 2px;
  ">
    <h1 style="
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 200;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.3;
      color: var(--black);
      margin-bottom: 14px;
    ">Kleding met karakter,<br>uit het hart van Harlingen.</h1>

    <p style="
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
    ">Midden in het hart van Harlingen vind je MOJ, een plek waar damesmode en persoonlijke aandacht samenkomen. Onze inspirerende dames staan voor je klaar om je te verwelkomen, adviseren en verrassen met de mooiste fashion.</p>
  </div>

</section>
