<style>
  .lb-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: auto;
    gap: 26px 22px;
  }
  .lb-item {
    display: block;
    overflow: hidden;
    border-radius: 0;
    box-shadow: 0 10px 24px rgba(42, 45, 30, 0.14);
  }
  .lb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .lb-text {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    box-shadow: none;
  }
  .lb-text p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(18px, 1.8vw, 24px);
    font-weight: 300;
    line-height: 1.6;
    color: var(--black);
  }

  .lb1  { transform: translateY(-14px); }
  .lb2  { transform: translateY(18px); }
  .lb3  { transform: translateY(-8px); }
  .lb4  { transform: translateY(12px); }
  .lb5  { transform: translateY(-16px); }
  .lb6  { transform: translateY(-6px); }
  .lb7  { transform: translateY(-12px); }
  .lb8  { transform: translateY(16px); }
  .lb9  { transform: translateY(4px); }

  @media (max-width: 700px) {
    .lb-grid { grid-template-columns: 1fr 1fr; }
    .lb-item { transform: none !important; }
  }
  @media (max-width: 600px) {
    .lb-grid { grid-template-columns: 1fr; }
    .lb-item {
      grid-column: auto !important;
      grid-row: auto !important;
      height: 300px !important;
    }
  }
  @media (max-width: 480px) {
    .lb-section { padding: 120px 20px 60px !important; }
  }
</style>

<section class="lb-section" style="padding: 156px 40px 80px; background: transparent;">

  <div style="margin-bottom: 80px;">
    <h2 style="
      font-family: 'Josefin Sans', sans-serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 200;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--black);
    ">Lookbook</h2>
  </div>

  <div class="lb-grid">

    <!-- Grote foto links bovenaan — 2 rijen hoog -->
    <div class="lb-item lb1" style="grid-column: 1; grid-row: 1 / 3;">
      <img src="../images/IMG_4914.webp"/>
    </div>

    <!-- Rechts bovenaan -->
    <div class="lb-item lb2" style="grid-column: 2; grid-row: 1; height: 320px;">
      <img src="../images/IMG_4912.webp"/>
    </div>

    <!-- Rechts van midden bovenaan -->
    <div class="lb-item lb3" style="grid-column: 3; grid-row: 1; height: 320px;">
      <img src="../images/IMG_4915.webp"/>
    </div>

    <!-- Gedicht, als een van de tegels tussen de foto's -->
    <div class="lb-item lb-text lb4" style="grid-column: 2; grid-row: 2; height: 320px;">
      <p>We love…<br>the rhythm of the sea<br>stormy winds and<br>whispering trees</p>
    </div>

    <!-- Rechts rij 2 -->
    <div class="lb-item lb5" style="grid-column: 3; grid-row: 2; height: 320px;">
      <img src="../images/IMG_4910.webp"/>
    </div>

    <!-- Rij 3 — drie even grote foto's -->
    <div class="lb-item lb6" style="grid-column: 1; grid-row: 3; height: 280px;">
      <img src="../images/IMG_4911.webp" style="object-position: top;"/>
    </div>

    <div class="lb-item lb7" style="grid-column: 2; grid-row: 3; height: 280px;">
      <img src="../images/preview.webp" style="object-position: top;"/>
    </div>

    <div class="lb-item lb8" style="grid-column: 3; grid-row: 3; height: 280px;">
      <img src="../images/preview (1).webp"/>
    </div>

    <!-- Rij 4 — twee brede foto's -->
    <div class="lb-item lb9" style="grid-column: 1 / 3; grid-row: 4; height: 260px;">
      <img src="../images/IMG_4913.webp" style="object-position: center 30%;"/>
    </div>

    <div class="lb-item lb10" style="grid-column: 3; grid-row: 4; height: 260px;">
      <img src="../images/preview (2).webp"/>
    </div>

  </div>

</section>
