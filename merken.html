<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merken — MOJ Harlingen</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>

  <!-- Navigatie -->
  <div id="nav"></div>

  <!-- Merken -->
  <div id="merken"></div>

  <script>
    const sections = ['nav', 'merken'];
    sections.forEach(name => {
      fetch(`sections/${name}.html`)
        .then(r => r.text())
        .then(html => {
          document.getElementById(name).innerHTML = html;
        });
    });
  </script>

</body>
</html>
